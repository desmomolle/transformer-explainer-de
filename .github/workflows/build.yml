name: build
# Baut die statische Seite für das TechChamps-Lab (Pfad /explainer) und legt sie als Release-Paket ab.
# Der Raspberry Pi baut bewusst nicht selbst (Absturz beim lokalen Test, techchamps-lab#75).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Upstream-Lockfile passt nicht zusammen (vite 5 mit vite-plugin-svelte 6, das vite >= 6 verlangt): vite auf 7 gehoben,
      # Lockfile wird hier im Runner aufgelöst, nie auf dem Pi.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/prepare-offline.mjs
      - run: npm run build
        env:
          BASE_PATH: /werkzeug/transformer-explainer   # Pfad der Lab-Seite (techchamps-lab scripts/werkzeuge.py)
      - name: Keine fremden Laufzeit-Adressen im Build
        run: |
          # Hart: was unsere Seite selbst laden würde (Tracking, Fonts, Rechenkern, KaTeX von CDN)
          ! grep -rEo "googletagmanager[^\"']*|fonts\.googleapis[^\"']*|cdn\.jsdelivr\.net/npm/(onnxruntime-web|katex)[^\"']*" build --include=*.js --include=*.html --include=*.css
          # Nur Info: Standardwerte von @xenova/transformers (remoteHost, eigener WASM-Pfad), inaktiv durch allowRemoteModels=false
          grep -rEo "https://(huggingface\.co|cdn\.jsdelivr\.net)[^\"'\`]{0,60}" build --include=*.js | sort -u || true
      - run: tar -czf explainer-build.tar.gz -C build .
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest explainer-build.tar.gz --title "Build $(git rev-parse --short HEAD)" --notes "Statischer Build für /werkzeug/transformer-explainer"
